name: Mobile Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Bundled at build time. The test APK talks to production.
      EXPO_PUBLIC_API_URL: https://api.substrateco.xyz
      EXPO_PUBLIC_WEB_URL: https://app.substrateco.xyz
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Typecheck the mobile app
        run: bun run typecheck:mobile
      - name: Test the mobile app
        run: bun run test:mobile
      # android/ is generated, not committed.
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bun x expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
        with:
          # By default only the default branch saves the cache. Manual runs from any branch should
          # warm it for the next run.
          cache-read-only: false
      # The release variant bundles the JavaScript and signs with the template's debug key,
      # which is enough to sideload. Phones and current emulators run arm64. The build cache reuses
      # compiled native and Kotlin/Java outputs from earlier runs.
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: substrate-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
