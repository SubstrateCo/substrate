# Builds the desktop app for Windows (NSIS, x64) and macOS (arm64) and publishes the installers
# and update feeds (latest.yml, latest-mac.yml) to this repository. Installed apps
# read updates anonymously from that repository with electron-updater.
#
# Public HTTPS origins built into the app are set in the workflow env below.
# Repository secrets:
#   DESKTOP_RELEASE_APP_ID, DESKTOP_RELEASE_APP_PRIVATE_KEY  GitHub App installed on the source
#     repo with Contents and Pull requests: read and write, and Checks and Commit statuses: read.
#     The App must be allowed to merge under the repo's branch rules; no admin bypass is used.
#   Signing (optional, see the package steps): WINDOWS_CSC_LINK, WINDOWS_CSC_KEY_PASSWORD,
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release size (calculated from the desktop version on main)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# One release at a time, so two runs never race on the same draft.
concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  SUBSTRATE_API_URL: https://api.substrateco.xyz
  SUBSTRATE_WEB_URL: https://app.substrateco.xyz
  S3_ENDPOINT: https://t3.storageapi.dev
  BUN_VERSION: 1.4.4
  ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
  SUBSTRATE_RELEASES_OWNER: ${{ github.repository_owner }}
  SUBSTRATE_RELEASES_REPO: ${{ github.event.repository.name }}

jobs:
  source:
    name: Prepare release branch and PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      base: ${{ steps.release.outputs.base }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Require main and release credentials
        env:
          APP_ID: ${{ secrets.DESKTOP_RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Start desktop releases from main."
            exit 1
          fi
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Set DESKTOP_RELEASE_APP_ID and DESKTOP_RELEASE_APP_PRIVATE_KEY."
            exit 1
          fi
      - name: Create source repository token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DESKTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Test release version rules
        run: bun test scripts/desktop-release-version.test.ts
      - name: Prepare version commit and release PR
        id: release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: bun scripts/desktop-release.ts prepare

  validate:
    name: Validate
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check inputs and settings
        run: |
          failed=0
          for name in SUBSTRATE_API_URL SUBSTRATE_WEB_URL S3_ENDPOINT; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Set $name in the workflow env."
              failed=1
            elif ! [[ "$value" =~ ^https://[^/[:space:]]+/?$ ]]; then
              echo "::error::$name must be an HTTPS origin without a path, for example https://api.example.com. Got: $value"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck the desktop app
        run: bun run --filter @substrate/desktop typecheck
      - name: Test the desktop app
        working-directory: apps/desktop
        run: bun run test

  prepare:
    name: Create draft release
    needs: [source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Create release upload token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DESKTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
      # Both package jobs upload to this one draft. electron-builder reuses a draft with the
      # same tag, but two jobs that start together could each create their own.
      - name: Create or reuse the draft
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          tag="v$VERSION"
          repo="$SUBSTRATE_RELEASES_OWNER/$SUBSTRATE_RELEASES_REPO"
          release=$(gh api --paginate "repos/$repo/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | {id, draft}" | head -n 1)
          if [ -z "$release" ]; then
            gh api -X POST "repos/$repo/releases" \
              -f tag_name="$tag" -f name="Substrate $VERSION" -F draft=true \
              -f body="Substrate $VERSION for Windows and macOS (Apple silicon).

          Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA." > /dev/null
            echo "Created draft release $tag in $repo."
          elif [ "$(echo "$release" | jq -r .draft)" = "true" ]; then
            echo "Reusing draft release $tag in $repo."
          else
            echo "::error::Release $tag is already published in $repo. Choose a new version."
            exit 1
          fi

  package:
    name: Package (${{ matrix.platform }})
    needs: [source, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each job packages on its own OS and CPU, so Electron and any staged native files match.
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.source.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Electron packaging tools
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Verify the committed app version
        run: |
          bun -e '
            const manifest = await Bun.file("apps/desktop/package.json").json();
            if (manifest.version !== process.env.VERSION) {
              throw new Error("Committed app version does not match the release version");
            }
          '
      - name: Build the app
        working-directory: apps/desktop
        run: bun run build

      - name: Create release upload token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DESKTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}

      - name: Package and upload (Windows)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Signing hook. Add these secrets to sign the installer; without them it is unsigned
          # and SmartScreen warns on first install.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::warning::WINDOWS_CSC_LINK is not set. The Windows installer is unsigned."
          fi
          bunx electron-builder --win nsis --publish always \
            -c.publish.owner="$SUBSTRATE_RELEASES_OWNER" -c.publish.repo="$SUBSTRATE_RELEASES_REPO"

      - name: Package and upload (macOS)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Signing hook. Add MAC_CSC_LINK (base64 .p12 of a Developer ID Application
          # certificate) and its password to sign; add the APPLE_* secrets to notarize.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=()
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Apple silicon runs only signed code, so sign ad hoc. Hardened runtime would refuse
            # the ad-hoc-signed Electron framework, so it is off until a real certificate exists.
            signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            echo "::warning::MAC_CSC_LINK is not set. The macOS app is ad-hoc signed and not notarized."
          elif [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          bunx electron-builder --mac --publish always \
            -c.publish.owner="$SUBSTRATE_RELEASES_OWNER" -c.publish.repo="$SUBSTRATE_RELEASES_REPO" \
            "${signing[@]}"

  publish:
    name: Merge, tag, and publish release
    needs: [source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Create source and release repository token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DESKTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
      # Installed apps see a release only after it is published, so publish only when both
      # platforms uploaded their installers and update feeds.
      - name: Check draft assets
        id: draft
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          tag="v$VERSION"
          repo="$SUBSTRATE_RELEASES_OWNER/$SUBSTRATE_RELEASES_REPO"
          release=$(gh api --paginate "repos/$repo/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id" | head -n 1)
          if [ -z "$release" ]; then
            echo "::error::Draft release $tag was not found in $repo."
            exit 1
          fi
          assets=$(gh api --paginate "repos/$repo/releases/$release/assets?per_page=100" --jq '.[].name')
          for name in latest.yml latest-mac.yml Substrate-Setup.exe Substrate-mac-arm64.dmg Substrate-mac-arm64.zip; do
            if ! grep -qxF "$name" <<< "$assets"; then
              echo "::error::Release $tag is missing $name."
              exit 1
            fi
          done
          echo "id=$release" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Merge release PR and tag the verified source
        id: source
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_BASE: ${{ needs.source.outputs.base }}
          RELEASE_PR: ${{ needs.source.outputs.pr }}
        run: bun scripts/desktop-release.ts finalize
      - name: Publish installers and update feeds
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag="v$VERSION"
          repo="$SUBSTRATE_RELEASES_OWNER/$SUBSTRATE_RELEASES_REPO"
          gh api -X PATCH "repos/$repo/releases/$RELEASE_ID" \
            -f body="Substrate $VERSION for Windows and macOS (Apple silicon).

          Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$tag
          Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA" \
            -F draft=false -f make_latest=true > /dev/null
          echo "Published https://github.com/$repo/releases/tag/$tag"
