services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: rustfs/rustfs:1.0.0
    ports:
      - "127.0.0.1:4566:9000"
    environment:
      RUSTFS_ACCESS_KEY: startup_os
      RUSTFS_SECRET_KEY: startup_os_storage
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 3s
      timeout: 5s
      retries: 30
  s3-init:
    image: amazon/aws-cli:2.31.13
    environment:
      AWS_ACCESS_KEY_ID: startup_os
      AWS_SECRET_ACCESS_KEY: startup_os_storage
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/storage.sh"]
    volumes:
      - ./scripts/s3-storage.sh:/init/storage.sh:ro
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: startup_os
      POSTGRES_PASSWORD: startup_os
      POSTGRES_DB: startup_os
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup_os -d startup_os"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-e2e:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: startup_os_e2e
      POSTGRES_PASSWORD: startup_os_e2e
      POSTGRES_DB: startup_os_e2e_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup_os_e2e -d startup_os_e2e_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: startup_os_test
      POSTGRES_PASSWORD: startup_os_test
      POSTGRES_DB: startup_os_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup_os_test -d startup_os_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  s3_data:
  postgres_data:
